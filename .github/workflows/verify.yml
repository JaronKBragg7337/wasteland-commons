name: Verify Wasteland Commons

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:world
      - run: npm run test:authoritative
      - run: npm run test:persistence
      - run: npm run audit:materials -- --strict
      - run: npm run build
      - run: npm ci --prefix mobile/capacitor
      - run: npm run build:web --prefix mobile/capacitor
      - run: npm run copy --prefix mobile/capacitor
      - run: npm run test:native
